name: JS checks

# Fast, stack-free checks for the admin console and its shared libs.
# The upstream Playwright and admin-client mocha suites need a running
# Keycloak with admin/admin, so they are not run here.

on:
  pull_request:
    branches:
      - "26.7.0-IGA-*"
    paths:
      - "js/**"
      - ".github/workflows/js-checks.yml"
  push:
    branches:
      - "26.7.0-IGA-*"
    paths:
      - "js/**"
      - ".github/workflows/js-checks.yml"
  workflow_dispatch:

concurrency:
  group: js-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: js

env:
  # Skip the husky prepare script, git hooks are not needed in CI.
  HUSKY: "0"

jobs:
  unit:
    name: Build, typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Version comes from "packageManager" in js/package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: js/package.json

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml

      # The admin-client build downloads a ~38 MB kiota binary. Keep it around.
      - name: Cache kiota binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: js/libs/keycloak-admin-client/.kiota
          key: kiota-${{ runner.os }}-${{ hashFiles('js/libs/keycloak-admin-client/package.json') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # admin-ui tests import the built ui-shared, which needs the built
      # admin-client (kiota codegen + tsc). Wireit handles that chain.
      - name: Build ui-shared and admin-client
        run: pnpm --filter @keycloak/keycloak-ui-shared run build

      - name: Typecheck admin-ui
        working-directory: js/apps/admin-ui
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Unit tests (ui-shared)
        working-directory: js/libs/ui-shared
        run: pnpm exec vitest run

      - name: Unit tests (admin-ui)
        working-directory: js/apps/admin-ui
        run: pnpm exec vitest run
